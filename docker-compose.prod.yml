version: '3.8'

# Production version sem volumes mounted
services:
  postgres:
    image: postgres:16-alpine
    container_name: workout-spa-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-workout_spa}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workout-spa-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: workout-spa-api-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-workout_spa}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workout-spa-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: workout-spa-web-prod
    environment:
      NODE_ENV: production
      VITE_API_URL: ${API_URL:-http://localhost:3000}
    ports:
      - "80:5173"
    depends_on:
      - api
    networks:
      - workout-spa-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  workout-spa-network:
    driver: bridge
